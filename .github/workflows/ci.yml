name: Validate Static Threads

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Validate complete outfit image sets
        run: python scripts/validate_image_sets.py

      - name: Validate closet product images
        run: python scripts/validate_catalog_images.py

      - name: Type-check application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Install browser QA tools without changing application dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Prepare browser for navigation checks
        run: npx playwright install --with-deps chromium

      - name: Check mobile and desktop navigation
        run: node scripts/check_mobile_navigation.cjs

      - name: Save navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-navigation-qa
          path: /tmp/mobile-dock-qa/*.png
          if-no-files-found: ignore

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile catalogue scripts
        run: python -m compileall scripts

      - name: Validate catalogue records
        run: python scripts/validate_catalog.py
