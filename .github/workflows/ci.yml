name: Validate Static Threads

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check application
        run: npm run typecheck

      - name: Build application
        run: npm run build

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile catalogue scripts
        run: python -m compileall scripts

      - name: Validate catalogue records
        run: python scripts/validate_catalog.py
