name: Validate Static Threads

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Validate complete outfit image sets
        run: python scripts/validate_image_sets.py

      - name: Validate closet product images
        run: python scripts/validate_catalog_images.py

      - name: Type-check application
        run: npm run typecheck

      - name: Validate outfit planning constraints
        run: npm run test:planner

      - name: Validate web mannequin service contracts
        run: npm run test:outfit-visuals

      - name: Validate outfit photo import contracts
        run: npm run test:outfit-import

      - name: Validate Rush Hour planning
        run: npm run test:rush-hour

      - name: Build application
        run: npm run build

      - name: Install browser QA tools without changing application dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Prepare browser for navigation checks
        run: |
          if command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null; then
            echo "Using runner-provided Chrome for browser checks"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Check mobile and desktop navigation
        timeout-minutes: 3
        run: node scripts/check_mobile_navigation.cjs

      - name: Check outfit planning chat
        timeout-minutes: 3
        run: node scripts/check_outfit_chat.cjs

      - name: Check catalogue mannequin galleries
        timeout-minutes: 3
        run: node scripts/check_chat_visuals.cjs

      - name: Check outfit photo import review
        timeout-minutes: 3
        run: node scripts/check_outfit_import.cjs

      - name: Check Rush Hour session flow
        timeout-minutes: 3
        run: node scripts/check_rush_hour.cjs

      - name: Save mannequin chat screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-mannequin-qa
          path: /tmp/static-threads-chat-visuals/*.png
          if-no-files-found: ignore

      - name: Save chat screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outfit-chat-qa
          path: /tmp/static-threads-chat-qa/*.png
          if-no-files-found: ignore

      - name: Save navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-navigation-qa
          path: /tmp/mobile-dock-qa/*.png
          if-no-files-found: ignore

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile catalogue scripts
        run: python -m compileall scripts

      - name: Validate catalogue records
        run: python scripts/validate_catalog.py

  account-auth:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://auth-test.example
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-test-key-not-a-secret
      NEXT_PUBLIC_OUTFIT_VISUALS_ENABLED: "true"
      NEXT_PUBLIC_OUTFIT_IMPORT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check authentication
        run: npm run typecheck
      - name: Build isolated authentication test app
        run: npm run build
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null; then
            echo "Using runner-provided Chrome"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Exercise account lifecycle with intercepted auth service
        timeout-minutes: 3
        run: node scripts/check_account_auth.cjs
      - name: Check personal wardrobe chat contracts
        timeout-minutes: 3
        run: TEST_PRIVATE=1 node scripts/check_outfit_chat.cjs
      - name: Check web mannequin flow contracts
        timeout-minutes: 3
        run: TEST_WEB=1 node scripts/check_chat_visuals.cjs
      - name: Check configured photo import contracts
        timeout-minutes: 3
        run: TEST_IMPORT=1 node scripts/check_outfit_import.cjs
      - name: Check configured Rush Hour contracts
        timeout-minutes: 3
        run: TEST_RUSH=1 node scripts/check_rush_hour.cjs
      - name: Save account QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-auth-qa
          path: /tmp/static-threads-auth-qa/*.png
          if-no-files-found: ignore

  outfit-chat-rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual outfit-event RLS enforcement
        env:
          PGPASSWORD: ci-test-password
        run: |
          psql -h localhost -U postgres -d postgres -f scripts/test_outfit_chat_rls.sql
          psql -h localhost -U postgres -d postgres -f scripts/test_outfit_visual_quota.sql
          psql -h localhost -U postgres -d postgres -f scripts/test_outfit_import.sql
