name: Refresh retailer recommendations

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retailer-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh retailer product metadata
        run: python scripts/refresh_retailers.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Commit refreshed catalogue when changed
        shell: bash
        run: |
          if git diff --quiet -- data/shop-similar.ts; then
            echo "Retailer catalogue is already current."
            exit 0
          fi

          git config user.name "static-threads-bot"
          git config user.email "76061500+Utpal-Mishra@users.noreply.github.com"
          git add data/shop-similar.ts
          git commit -m "Refresh retailer recommendations"
          git push
